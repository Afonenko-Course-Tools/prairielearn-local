# Готовый student сайт. Корень current переключает ansible/deploy.yml после native sync.
services:
  course-site:
    image: ${NGINX_IMAGE:-docker.io/library/nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94}
    ports:
      - ${SITE_BIND_IP:-127.0.0.1}:${SITE_HTTP_PORT:-18088}:80
    volumes:
      - type: bind
        source: ${SITE_ROOT:?Нужен корень готовых releases и ссылки current}
        target: /sites
        read_only: true
        bind: { create_host_path: false }
      - ./config/nginx.site.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 96m
    cpus: 0.25
    restart: unless-stopped
