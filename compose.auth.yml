# Необязательная связка готовых native auth-конфигураций; курс здесь не импортируется.
services:
  pl:
    environment:
      PL_CONFIG_PATH: /run/pl-native/config.json
    volumes:
      - type: bind
        source: ${PL_CONFIG_FILE:?Нужен готовый native PL config с hasShib=true}
        target: /run/pl-native/config.json
        read_only: true
        bind: {create_host_path: false}


  bootstrap-admin:
    environment:
      PL_CONFIG_PATH: /run/pl-native/config.json
    volumes:
      - type: bind
        source: ${PL_CONFIG_FILE:?Нужен готовый native PL config}
        target: /run/pl-native/config.json
        read_only: true
        bind: {create_host_path: false}

  bridge:
    image: ${PL_IMAGE:-ghcr.io/afonenko-course-tools/prairielearn-community-gateway:2.5.8}
    platform: linux/amd64
    network_mode: service:pl
    working_dir: /PrairieLearn/apps/prairielearn
    entrypoint: [node, /PrairieLearn/apps/prairielearn/bridge/server.mjs]
    environment:
      NODE_ENV: production
      PL_GATEWAY_CONFIG: /run/pl-gateway/config.json
    volumes:
      - ${PL_CONFIG_FILE:?Нужен native PL config}:/PrairieLearn/config.json:ro
      - type: bind
        source: ${BRIDGE_CONFIG_DIR:?Нужен каталог готовых native Bridge config.json и tokenFile}
        target: /run/pl-gateway
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      bootstrap-admin: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, 'test "$$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/)" = 401']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  gateway-data-init:
    image: ${GATEWAY_IMAGE:-ghcr.io/afonenko-course-tools/moodle-prairielearn-gateway:3.0.1}
    user: '0:0'
    entrypoint: [python, -c, "import os; os.chown('/var/lib/gateway',1000,1000); os.chmod('/var/lib/gateway',0o700)"]
    volumes: [gateway-data:/var/lib/gateway]
    mem_limit: 64m
    cpus: 0.25
    restart: 'no'

  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/afonenko-course-tools/moodle-prairielearn-gateway:3.0.1}
    volumes:
      - type: bind
        source: ${GATEWAY_CONFIG_DIR:?Нужен каталог готового Gateway runtime.json и его секретов}
        target: /run/config
        read_only: true
        bind: {create_host_path: false}
      - gateway-data:/var/lib/gateway
    depends_on:
      gateway-data-init: {condition: service_completed_successfully}
      bridge: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',18080),timeout=2).close()"]
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    restart: unless-stopped

  proxy:
    command: [nginx, -c, /state/nginx-auth.conf, -g, "daemon off;"]
    volumes:
      - type: bind
        source: ${GATEWAY_CONFIG_DIR:?Нужен каталог Gateway}/handoff-auth.conf
        target: /etc/nginx/private/handoff-auth.conf
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      gateway: {condition: service_healthy}

volumes:
  gateway-data:
