worker_processes auto;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen PL_PUBLIC_PORT ssl;
    server_name PL_PUBLIC_HOST;
    ssl_certificate /state/tls/server.crt;
    ssl_certificate_key /state/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /healthz { return 200 'ok\n'; }
    location = / { return 302 /pl/; }
    location = /gateway { return 302 /pl/; }
    location = /gateway/ { return 302 /pl/; }
    location /gateway/ { return 404; }
    location /internal/ { return 404; }
    location = /pl/shibcallback { return 403; }
    location ^~ /pl/shibcallback/ { return 403; }
    location = /favicon.ico {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Trust-Auth-Uid "";
      proxy_set_header X-Trust-Auth-Name "";
      proxy_set_header X-Trust-Auth-Name-UTF8-B64 "";
      proxy_set_header X-Trust-Auth-Uin "";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Forwarded "";
      proxy_pass http://pl:3000;
    }
    location ^~ /assets/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Trust-Auth-Uid "";
      proxy_set_header X-Trust-Auth-Name "";
      proxy_set_header X-Trust-Auth-Name-UTF8-B64 "";
      proxy_set_header X-Trust-Auth-Uin "";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Forwarded "";
      proxy_pass http://pl:3000;
    }
    location /pl/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Trust-Auth-Uid "";
      proxy_set_header X-Trust-Auth-Name "";
      proxy_set_header X-Trust-Auth-Name-UTF8-B64 "";
      proxy_set_header X-Trust-Auth-Uin "";
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Forwarded "";
      proxy_pass http://pl:3000;
    }
    location /socket.io/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Trust-Auth-Uid "";
      proxy_set_header X-Trust-Auth-Name "";
      proxy_set_header X-Trust-Auth-Name-UTF8-B64 "";
      proxy_set_header X-Trust-Auth-Uin "";
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Forwarded "";
      proxy_pass http://pl:3000;
    }
    location / { return 404; }
  }
  server {
    listen MOODLE_PUBLIC_PORT ssl;
    server_name MOODLE_PUBLIC_HOST;
    ssl_certificate /state/tls/server.crt;
    ssl_certificate_key /state/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 40m;
    location / {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Forwarded "";
      proxy_pass http://moodle:80;
    }
  }
}
