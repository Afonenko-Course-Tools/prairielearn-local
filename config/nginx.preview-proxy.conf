proxy_pass http://pl:3000;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $preview_connection;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto http;
proxy_set_header Forwarded "";
proxy_set_header X-Trust-Auth-Uid "";
proxy_set_header X-Trust-Auth-Name "";
proxy_set_header X-Trust-Auth-Name-UTF8-B64 "";
proxy_set_header X-Trust-Auth-Uin "";
proxy_set_header X-Trust-Auth-Date "";
proxy_read_timeout 300s;
