map $http_upgrade $preview_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /output/PREVIEW_COURSE/site;
    index index.html;
    client_max_body_size 100m;
    location = /healthz { return 200 'preview proxy ready\n'; }
    location /pl { include /etc/nginx/preview-proxy.conf; }
    location /assets/ { include /etc/nginx/preview-proxy.conf; }
    location /socket.io/ { include /etc/nginx/preview-proxy.conf; }
    location / { try_files $uri $uri/ =404; }
}
